import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

rootProject.ext.mavenUserName=""
rootProject.ext.mavenPassword=""

if (file("./build.gradle.local").exists()) {
    apply from: "./build.gradle.local"
}

allprojects {
    group 'uk.co.notnull'
    version '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()

        maven {
            url 'https://repo.not-null.co.uk/snapshots/'
        }
        maven {
            url "https://papermc.io/repo/repository/maven-public/"
        }
    }

    compileJava {
        options.compilerArgs += ["-Xlint:all", "-Xlint:-processing"]
        options.encoding = 'UTF-8'
    }
}

dependencies {
    implementation project(':CustomItemsAPI')
    implementation 'uk.co.notnull:MessagesHelper-paper:1.0-SNAPSHOT'

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT"
    compileOnly 'com.google.guava:guava:31.1-jre'
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

tasks {
    processResources {
        from("${project.rootDir}/src/main/resources") {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
            project.properties.findAll().each {
                prop ->
                    if (prop.value != null && prop.value instanceof java.lang.String) {
                        filter(ReplaceTokens, tokens: [(prop.key): prop.value])
                        filter(ReplaceTokens, tokens: [('project.' + prop.key): prop.value])
                    }
            }
        }
    }

    shadowJar {
        archiveClassifier.set('')
        relocate 'uk.co.notnull.messageshelper', 'uk.co.notnull.CustomItems.shaded.messageshelper'
    }

    build {
        dependsOn(shadowJar)
    }
}
